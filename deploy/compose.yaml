# docker compose -f deploy/compose.yaml run --rm cleis init --data /data --org "Example Studio"
# docker compose -f deploy/compose.yaml up -d
services:
  cleis:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: cleis-server
    ports:
      - "8443:8443"
    volumes:
      - cleis:/data
    restart: unless-stopped
volumes:
  cleis:
