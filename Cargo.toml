[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
cleis-crypto = { path = "crates/cleis-crypto" }
cleis-core = { path = "crates/cleis-core" }
cleis-store = { path = "crates/cleis-store" }
aes-gcm = "0.11"
argon2 = "0.6"
x25519-dalek = { version = "3", features = ["static_secrets", "zeroize"] }
ed25519-dalek = { version = "3", features = ["zeroize"] }
sha2 = "0.11"
sha1 = "0.11"
hmac = "0.13"
hkdf = "0.13"
getrandom = "0.4"
zeroize = { version = "1.9", features = ["derive"] }
subtle = "2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
rusqlite = { version = "0.43", features = ["bundled"] }
csv = "1.4"
data-encoding = "2.11"
thiserror = "2"
url = "2.5"
strsim = "0.11"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Key derivation and ciphers are unusably slow unoptimised; keep debug builds responsive.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.aes-gcm]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
