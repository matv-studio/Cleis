[package]
name = "cleis-app"
description = "Cleis desktop application (GPUI)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "cleis"

[[bin]]
name = "cleis"
path = "src/main.rs"

[dependencies]
cleis-core.workspace = true
cleis-crypto.workspace = true
cleis-store.workspace = true
cleis-autofill.workspace = true
cleis-net.workspace = true
uuid.workspace = true
data-encoding.workspace = true
# Local time of the activity log and history.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Pinned exactly: GPUI is pre-1.0 and gpui-kit fixes the matching gpui-pre snapshot (D-33).
gpui-kit = "=0.11.0"
directories = "6"
# First launch: the system's language (U-9).
sys-locale = "0.3"
serde_json.workspace = true
serde.workspace = true
anyhow = "1"
async-channel = "2"
zeroize.workspace = true
# QR code of the verification-code key (Security › Opening the app).
qrcode = { version = "0.15", default-features = false }
# Sign-in with Google / Microsoft: the provider's endpoints (D-64).
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
# SFTP sync place (D-65): pure-Rust SSH, ring backend.
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "2"
tokio = { version = "1", features = ["rt", "net", "time", "io-util"] }
# Colour wheel drawn once (mockup 36), contact photos scaled down (36e). Already in the tree via GPUI.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
# Updates (D-74): versions compared.
semver = "1"

[target.'cfg(windows)'.dependencies]
# Reads window handles: Quick Access brought in front without GPUI's simulated Alt, main window
# hidden to the notification area.
raw-window-handle = "0.6"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
# Notification area (Windows) / menu bar (macOS) icon.
tray-icon = "0.26"

[build-dependencies]
# The program's icon in the executable (Windows), read by GPUI for the window and the taskbar.
embed-resource = "3"

[dev-dependencies]
gpui-kit = { version = "=0.11.0", features = ["test-support"] }
tempfile = "3"
cleis-server = { path = "../cleis-server" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync"] }

[lints]
workspace = true
