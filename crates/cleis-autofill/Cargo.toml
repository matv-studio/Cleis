[package]
name = "cleis-autofill"
description = "Cleis autofill: global shortcuts, window in front, filling fields by accessibility or typing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cleis-core.workspace = true
global-hotkey = "0.10"
enigo = "0.6"
arboard = { version = "3", default-features = false }
zeroize.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
uiautomation = "0.25"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    # Biometric unlock (D-66): Windows Hello, DPAPI.
    "Foundation",
    "Security_Credentials_UI",
    "Win32_Security_Cryptography",
    "Win32_System_WinRT",
] }
windows-future = "0.3"
# Open at login: value under HKCU\Software\Microsoft\Windows\CurrentVersion\Run.
windows-registry = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication"] }
# Biometric unlock (D-66): Touch ID, login keychain.
objc2-local-authentication = { version = "0.3", features = ["LAContext", "block2"] }
block2 = "0.6"
security-framework = "3"

[features]
# A stand-in for Windows Hello / Touch ID in end-to-end tests.
test-support = []

[lints]
workspace = true
