name: Tag

# A version's tag, made by GitHub Actions (as in Revel): the session that prepares a version cannot
# push a tag itself. Pushing the branch `release/vX.Y.Z` at the commit validated by the user tags that
# commit `vX.Y.Z` (author Claude, D-41), starts the Build workflow on the tag (its DRAFT release,
# published by a person), then removes the branch.

on:
  push:
    branches: ["release/v*"]

permissions:
  contents: write
  actions: write

concurrency:
  group: tag-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Tag the commit
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          tag="${BRANCH#release/}"
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$tag" != "v$ver" ]; then
            echo "::error::$tag does not match the workspace version $ver"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag already exists"
            exit 1
          fi
          git -c user.name=Claude -c user.email=noreply@anthropic.com \
            tag -a "$tag" "$GITHUB_SHA" -m "Cleis $ver"
          git push origin "refs/tags/$tag"
          echo "TAG=$tag" >> "$GITHUB_ENV"
      # A tag pushed with GITHUB_TOKEN starts no workflow; a dispatch does.
      - name: Build the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/dispatches" \
            -f ref="$TAG"
      - name: Remove the request branch
        if: always()
        env:
          BRANCH: ${{ github.ref_name }}
        run: git push origin --delete "$BRANCH" || true
