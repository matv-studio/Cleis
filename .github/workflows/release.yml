name: Build

# Release builds of the desktop app.
# - Run by hand on main (a dispatch): Windows installer (D-75) as a workflow artifact; macOS too
#   when asked (input `macos`).
# - A `v*` tag (tag.yml dispatches this workflow on it): every build, attached to a DRAFT release
#   that a person reviews and publishes.
# Order (D-107): servers (Linux, QNAP) > Windows > macOS Apple silicon > macOS Intel. The repository
# is public: standard GitHub-hosted runners, macOS included, cost no minutes. macOS builds are
# unsigned (no Apple membership).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      macos:
        description: Also build for macOS (Apple silicon and Intel, unsigned)
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    # D-78: the installer carries Cleis Server for a NAS (QNAP packages, Linux servers).
    needs: server-qnap
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # Audit X-7: CI already tests every push; a tag (a version) is tested again here.
      - name: Tests
        if: startsWith(github.ref, 'refs/tags/')
        run: cargo test --workspace
      - name: Release build
        run: cargo build --release -p cleis-app -p cleis-server --locked
        env:
          # D-104: Google's desktop client secret (not confidential for an installed app, kept out
          # of git all the same); without it, Google sign-in shows "Not available in this build".
          CLEIS_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: server-bin-*
          path: dist/files/server
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cleis-server-qnap
          path: dist/files/server
      - name: Package (installer)
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          $ver = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$ver") {
            throw "Tag ${{ github.ref_name }} does not match the workspace version $ver"
          }
          $name = "Cleis-$ver-$sha-windows-x64-setup"
          $files = "dist/files"
          New-Item -ItemType Directory -Path $files -Force | Out-Null
          Copy-Item target/release/cleis.exe "$files/Cleis.exe"
          Copy-Item target/release/cleis-server.exe "$files/cleis-server.exe"
          Copy-Item README.md, THIRD_PARTY.md "$files/"
          # Audit X-1: the licence texts of every crate built in, and the typeface's.
          python tools/licenses.py -o "$files/THIRD_PARTY_LICENSES.txt" cleis-app cleis-server
          Copy-Item crates/cleis-app/assets/fonts/OFL.txt "$files/OFL.txt"
          Copy-Item deploy/README.md "$files/SERVER.md"
          # D-75: NSIS (not on the windows-2025 image: installed from Chocolatey); per-user
          # installer, no administrator.
          $nsis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $nsis) {
            choco install nsis --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "NSIS not installed" }
            $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          }
          $src = (Resolve-Path $files).Path
          $out = Join-Path (Resolve-Path dist).Path "$name.exe"
          & $nsis /V2 "/DVERSION=$ver" "/DSRC=$src" "/DOUT=$out" packaging/windows/cleis.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed" }
          Get-FileHash "dist/$name.exe" -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $name.exe" } | Out-File -Encoding ascii "dist/$name.exe.sha256"
          "NAME=$name" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.NAME }}
          path: |
            dist/${{ env.NAME }}.exe
            dist/${{ env.NAME }}.exe.sha256
          retention-days: 30

  # Static (musl) server for any Linux: QNAP QTS, Synology DSM and old distributions have older
  # C libraries than the build machine (D-78). ARM built on GitHub's ARM runner.
  server-linux:
    strategy:
      matrix:
        include:
          - { arch: x64, qnap: x86_64, runner: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { arch: arm64, qnap: arm_64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release -p cleis-server --locked --target ${{ matrix.target }}
      - run: |
          mkdir -p bin
          cp target/${{ matrix.target }}/release/cleis-server "bin/cleis-server-${{ matrix.qnap }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-bin-${{ matrix.qnap }}
          path: bin/cleis-server-${{ matrix.qnap }}
          retention-days: 30
      # Licences of the crates built into the server (one list: the same crates on both Linux).
      - if: matrix.arch == 'x64'
        run: python3 tools/licenses.py -o THIRD_PARTY_LICENSES.txt cleis-server
      - if: matrix.arch == 'x64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-licenses
          path: THIRD_PARTY_LICENSES.txt
          retention-days: 30

  # Cleis Server in QNAP's App Center (D-78): a QPKG per architecture, built with QNAP's QDK.
  server-qnap:
    needs: server-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: server-bin-*
          path: bin
          merge-multiple: true
      - name: QDK (QNAP's package builder)
        run: |
          curl -fsSL -o qdk.deb https://github.com/qnap-dev/QDK/releases/download/v2.5.3/qdk_2.5.3_amd64.deb
          sudo apt-get install -y ./qdk.deb
      - run: |
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          export PATH="$PATH:/usr/share/QDK/bin"
          packaging/qnap/build.sh "$ver" x86_64=bin/cleis-server-x86_64 arm_64=bin/cleis-server-arm_64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cleis-server-qnap
          path: dist/*.qpkg
          retention-days: 30
      # D-108: the one server download of a version (installing without the app).
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: server-licenses
          path: licenses
      - name: Server archive
        run: |
          sha=$(echo "${{ github.sha }}" | cut -c1-7)
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          name="Cleis-Server-$ver-$sha"
          d="out/$name"
          mkdir -p "$d/linux-x64" "$d/linux-arm64" "$d/qnap"
          install -m 755 bin/cleis-server-x86_64 "$d/linux-x64/cleis-server"
          install -m 755 bin/cleis-server-arm_64 "$d/linux-arm64/cleis-server"
          cp dist/*.qpkg "$d/qnap/"
          cp deploy/README.md "$d/README.md"
          cp -r deploy "$d/deploy"
          cp THIRD_PARTY.md licenses/THIRD_PARTY_LICENSES.txt "$d/"
          (cd out && zip -qry "$name.zip" "$name")
          echo "NAME=$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.NAME }}
          path: out/${{ env.NAME }}.zip
          retention-days: 30

  # D-107: after Windows, Apple silicon then Intel (one at a time). macos-15-intel is GitHub's last
  # Intel image (until August 2027); after it, Intel is to be cross-built on the Apple silicon runner.
  macos:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.macos
    needs: windows
    strategy:
      max-parallel: 1
      matrix:
        include:
          - { arch: arm64, runner: macos-15 }
          - { arch: x64, runner: macos-15-intel }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.arch }}
      - name: Build
        run: cargo build --release -p cleis-app -p cleis-server --locked
        env:
          # D-104: Google's desktop client secret (not confidential for an installed app, kept out
          # of git all the same); without it, Google sign-in shows "Not available in this build".
          CLEIS_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      # D-108: the servers a NAS needs, beside the app (as in the Windows setup).
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: server-bin-*
          path: server
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cleis-server-qnap
          path: server
      - name: Package (zip)
        run: |
          sha=$(echo "${{ github.sha }}" | cut -c1-7)
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "${{ github.ref_type }}" = tag ] && [ "${{ github.ref_name }}" != "v$ver" ]; then
            echo "::error::Tag ${{ github.ref_name }} does not match the workspace version $ver"
            exit 1
          fi
          want=$([ "${{ matrix.arch }}" = arm64 ] && echo arm64 || echo x86_64)
          for b in cleis cleis-server; do
            got=$(lipo -archs "target/release/$b")
            if [ "$got" != "$want" ]; then
              echo "::error::$b is $got, expected $want"
              exit 1
            fi
          done
          name="Cleis-$ver-$sha-macos-${{ matrix.arch }}-unsigned"
          mkdir -p "dist/$name"
          cp target/release/cleis "dist/$name/Cleis"
          cp target/release/cleis-server README.md THIRD_PARTY.md "dist/$name/"
          python3 tools/licenses.py -o "dist/$name/THIRD_PARTY_LICENSES.txt" cleis-app cleis-server
          cp crates/cleis-app/assets/fonts/OFL.txt "dist/$name/OFL.txt"
          cp deploy/README.md "dist/$name/SERVER.md"
          mkdir -p "dist/$name/server"
          for f in server/*; do install -m 755 "$f" "dist/$name/server/"; done
          (cd dist && zip -qry "$name.zip" "$name")
          echo "NAME=$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.NAME }}
          path: dist/${{ env.NAME }}.zip
          retention-days: 30

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [server-linux, server-qnap, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The version's notes (EN + FR) come with the code: docs/notes/vX.Y.Z.md.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          sparse-checkout: docs/notes
      # D-108: the installers and the server archive only (the bare servers are inside them).
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: Cleis-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum $(ls | grep -v '\.sha256$') > SHA256SUMS && cat SHA256SUMS
      - name: Draft release (published by a person)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/notes/${GITHUB_REF_NAME}.md"
          if [ ! -f "$notes" ]; then
            echo "Draft: write the notes (EN + FR) in docs/notes/${GITHUB_REF_NAME}.md." > /tmp/notes.md
            notes=/tmp/notes.md
          fi
          gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --draft \
            --title "Cleis ${GITHUB_REF_NAME}" --notes-file "$notes"
